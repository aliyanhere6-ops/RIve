<!doctype html><meta charset="utf-8"><title>Hand, eye and background integration check</title><body style="background:#171923;color:white;font:14px system-ui"><h1 id="result">Checking upgraded Rive…</h1><pre id="detail"></pre><canvas id="avatar" style="width:500px;height:499px"></canvas><script type="module">
import {createAvatar} from './avatar-renderer.mjs';
const result=document.getElementById('result'),canvas=document.getElementById('avatar');
try{
const a=await createAvatar(canvas,()=>{});a.number('xy').value=1;
if(!a.details.handsAvailable||!a.details.eyesAvailable)throw Error('Exported hand/eye targets missing');
for(const name of ['visemes','Expressions','poses','sizing ','xy'])if(!a.number(name))throw Error(name+' missing');
const wait=()=>new Promise(resolve=>setTimeout(resolve,700));
a.background.setColor('#ff2255');await wait();
if((a.background.color>>>0)!==0xffff2255)throw Error('Background colour binding failed: '+a.background.color);
const ctx=canvas.getContext('2d');const alpha=()=>{const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let n=0;for(let i=3;i<data.length;i+=4)if(data[i]>240)n++;return n;};
const opaque=alpha();a.background.setTransparent(true);await wait();
if(a.background.transparent!==1||alpha()>=opaque*.95)throw Error('Background transparency did not remove artwork');
a.target.enabled=true;a.detailTargets.hands={left:{x:380,y:250,rotation:.2},right:{x:120,y:250,rotation:-.2}};
a.detailTargets.eyes={left:{x:.8,y:0},right:{x:.8,y:0}};await wait();
if(!a.details.hands.left.tracked||!a.details.hands.right.tracked)throw Error('Hand targets did not move');
const eyes=structuredClone(a.details.eyes);a.detailTargets.eyes={left:{x:-.8,y:0},right:{x:-.8,y:0}};await wait();
document.getElementById('detail').textContent=JSON.stringify({before:eyes,after:a.details.eyes},null,2);
if(a.details.eyes.left.gazeX!==0||a.details.eyes.right.gazeX!==0)throw Error('Removed eye tracking is still active');
a.detailTargets.hands={left:{x:-400,y:-400},right:{x:900,y:900}};await wait();
for(const side of ['left','right'])if(a.details.hands[side].reach>235.01)throw Error('Wrist escaped arm reach');
a.target.enabled=false;a.detailTargets.enabled=true;
a.detailTargets.hands={left:{x:0,y:230,relative:true},right:{x:0,y:230,relative:true}};await wait();await wait();
for(const side of ['left','right']){
 const h=a.details.hands[side];
 if(!h.tracked||Math.abs(h.x-h.shoulder.x)>5||Math.abs(h.y-h.shoulder.y-230)>5)throw Error('Hands must track their shoulders even without a face');
}
document.getElementById('detail').textContent=JSON.stringify(a.details,null,2);
result.textContent='PASS: body-relative hands work without face detection; arm reach, disabled eye gaze and background controls preserved';
window.addEventListener('pagehide',()=>a.dispose());
}catch(e){result.textContent='FAIL: '+e.message;throw e;}
</script>
